<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PharmaGuard - Drug Interaction Checker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>PharmaGuard - Drug Interaction Checker</h1>
        <form action="/result" method="POST">
            <label for="drug_a">Drug A:</label>
            <input list="drugs" name="drug_a" required>

            <label for="drug_b">Drug B:</label>
            <input list="drugs" name="drug_b" required>

            <label for="gender">Gender:</label>
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
            </select>

            <label for="age">Age:</label>
            <input type="number" name="age" value="30" required>

            <label for="diabetes">Diabetes:</label>
            <select name="diabetes">
                <option>No</option>
                <option>Yes</option>
            </select>

            <datalist id="drugs">
                {{ drug_options }}
            </datalist>

            <br><br>
            <input type="submit" value="Check Interaction">
        </form>
    </div>
</body>
</html>
 <!DOCTYPE html>

  <div class="form-box">

      <input list="drugs" name="drug_a" required>

      <label for="drug_b">Drug B:</label>
      <input list="drugs" name="drug_b" required>

      <datalist id="drugs">
        {{ drug_options }} <!-- Injected by Flask -->
      </datalist>

      <label for="gender">Gender:</label>
      <select name="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="age">Age:</label>
      <input type="number" name="age" value="30">

      <label for="diabetes">Diabetes:</label>
      <select name="diabetes">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>

      <button type="submit">Check Interaction</button>
    </form>
  </div>
</body>
</html> 


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PharmaGuard | Visualize</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body> 
  <!-- ✅ Navigation Bar -->
  <div class="navbar">
    <img src="logo.png" alt="Logo">
    <a href="/intro">Home</a>
    <a href="/index" class="active">Visualize</a>
    <a href="/bookmarks">Bookmarks</a>
    <a href="#faq">FAQ</a>
  </div>

  <!-- ✅ Form Section -->
  <div class="form-box">
    <h2>Check Drug Interaction</h2>
    <form action="/result" method="POST">
      <!-- Drug A -->
      <label for="drug_a">Drug A:</label>
      <input list="drugs" name="drug_a" id="drug_a" required>

      <!-- Drug B -->
      <label for="drug_b">Drug B:</label>
      <input list="drugs" name="drug_b" id="drug_b" required>

      <!-- ✅ Injected options from Flask -->
      <datalist id="drugs">
        {{ drug_options | safe }}
      </datalist>

      <!-- Gender -->
      <label for="gender">Gender:</label>
      <select name="gender" id="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <!-- Age -->
      <label for="age">Age:</label>
      <input type="number" name="age" id="age" value="30" min="0" max="120" required>

      <!-- Diabetes -->
      <label for="diabetes">Diabetes:</label>
      <select name="diabetes" id="diabetes">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>

      <button type="submit">Check Interaction</button>
    </form>
  </div>
</body>
</html>
