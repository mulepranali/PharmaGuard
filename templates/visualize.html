<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PharmaGuard | Visual Summary</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #fafafa;
    }
    .navbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background-color: #222;
      padding: 20px;
    }
    .navbar img {
      margin-right: auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }
    .navbar a {
      margin-left: 20px;
      color: white;
      text-decoration: none;
      padding: 5px 10px;
      border-bottom: 2px solid transparent;
    }
    .navbar a.active, .navbar a:hover {
      border-bottom: 2px solid white;
    }
    .result-box {
      max-width: 700px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .result-box a {
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
      padding: 10px 20px;
      background-color: #00bcd4;
      color: white;
      border-radius: 5px;
    }
    .result-box a:hover {
      background-color: #0097a7;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img src="https://thumbs.dreamstime.com/b/quantum-computing-drug-discovery-quantum-computing-drug-discovery-generative-ai-generative-ai-329675973.jpg" alt="Logo">
    <a href="/intro">Home</a>
    <a href="/index">Visualize</a>
    <a href="/bookmarks">Bookmarks</a>
    <a href="#faq">FAQ</a>
  </div>

  <div class="result-box">
    <h2>🔬 Visual Result Coming Soon</h2>
    <p>This page will show side-effect charts or risk visualization.</p>
    <a href="/index">🔙 Back to Interaction</a>
  </div>
</body>
</html>
